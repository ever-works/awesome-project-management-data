markdown: >-
  ## Overview


  Any.do is a task management platform that expanded into team project
  management with Any.do Workspace, balancing personal productivity with
  collaborative project features.


  ## Features


  - Any.do Workspace for team project management

  - Chat and file sharing for collaboration

  - View options: Kanban, calendar, table, and Gantt

  - Simple if/then automation

  - My Day daily agenda builder for individual task focus

  - Fewer than 20 native integrations

  - Zapier integration for connecting with thousands of other apps

  - Unlimited project boards and team members (Teams plan)


  ## Pricing


  - **Free plan**: Personal task management and individual features

  - **Teams plan**: From $4.99/user/month (billed annually), includes
  collaborative workspace, unlimited project boards and team members, plus
  advanced project management features


  ## Deployment


  Cloud-based SaaS (Web, iOS, Android)


  ## Integrations


  Fewer than 20 native integrations; Zapier integration connects with thousands
  of additional tools.
