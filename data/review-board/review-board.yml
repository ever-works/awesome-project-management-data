markdown: >-
  ## Overview


  Review Board is an extensible and friendly code review tool for projects and
  companies of all sizes.


  ## Features


  - Code review (pre-commit and post-commit)

  - Support for Git, Mercurial, Subversion, Perforce

  - Review requests

  - Commenting and discussion

  - Approval workflows

  - Integration with issue trackers


  ## License


  MIT


  ## Deployment


  Self-hosted, Python, Docker
