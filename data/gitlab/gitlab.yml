markdown: >-
  ## Overview


  GitLab is a DevOps platform that provides Git repository management, code
  reviews, issue tracking, activity feeds, and wikis. It offers both a
  self-hosted Community Edition and cloud SaaS options.


  ## Features


  - Git repository management

  - Code reviews

  - Issue tracking

  - Activity feeds

  - Wikis

  - CI/CD pipelines

  - Container registry


  ## License


  MIT (Community Edition)


  ## Deployment


  Self-hosted, cloud (SaaS), Ruby, Docker, K8S
