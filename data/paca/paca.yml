markdown: >-
  ## Overview


  Paca is an AI-native project management platform where AI agents and humans
  collaborate as Scrum teammates on the same board and sprints.


  ## Features


  - AI agents as Scrum teammates

  - Board and sprint management

  - Configurable via config files

  - WASM plugins

  - Alternative to Jira, Trello, ClickUp


  ## License


  Apache-2.0


  ## Deployment


  Self-hosted, Docker, K8S
