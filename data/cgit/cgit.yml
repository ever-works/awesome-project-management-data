markdown: >-
  ## Overview


  Cgit is a fast, lightweight web interface for git repositories. It is written
  in C and designed for minimal resource usage while providing repository
  browsing capabilities.


  ## Features


  - Web interface for git repositories

  - Repository browsing

  - Commit history viewing

  - File browsing

  - Lightweight and fast


  ## License


  GPL-2.0


  ## Deployment


  Self-hosted
