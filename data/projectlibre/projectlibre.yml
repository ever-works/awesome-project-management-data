markdown: >-
  ## Overview


  ProjectLibre is an open-source project management software designed as a
  desktop replacement for Microsoft Project.


  ## Features


  - Project scheduling and task management

  - Document management

  - Project budget and expense tracking

  - Cloud progress updates


  ## Pricing


  Free and open-source under the Common Public Attribution License.


  ## Repository


  https://github.com/projectlibre/projectlibre
