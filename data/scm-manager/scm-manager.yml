markdown: >-
  ## Overview


  SCM Manager is the easiest way to share and manage Git, Mercurial, and
  Subversion repositories over HTTP.


  ## Features


  - Git, Mercurial, and Subversion support

  - HTTP-based repository sharing

  - Web-based administration

  - User and permission management

  - Repository browser


  ## License


  BSD-3-Clause


  ## Deployment


  Self-hosted, Java, Docker, K8S
