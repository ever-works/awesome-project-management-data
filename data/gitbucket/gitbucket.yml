markdown: >-
  ## Overview


  Gitbucket is a Git platform powered with easy installation, high
  extensibility, and GitHub API compatibility. It serves as a self-hosted
  alternative to GitHub.


  ## Features


  - Git repository hosting

  - Issue tracking

  - Pull requests

  - Wiki

  - GitHub API compatibility

  - Plugin system for extensibility


  ## License


  Apache-2.0


  ## Deployment


  Self-hosted, Scala, Java
