markdown: >-
  ## Overview


  Hive is a simple yet scalable project manager with a minimalist,
  easy-to-navigate interface and extensive view customization options.


  ## Features


  - Multiple view options: three Kanban variants, list, table, Gantt, calendar,
  and timeline

  - Toggle between views, pin favorites, and set views to private

  - Conversational AI assistant (Buzz) for summarizing projects, generating task
  descriptions and subtasks, and brainstorming

  - Add-ons to extend the feature set (timesheets, proofing and approvals
  modules)

  - Support for over 1,000 integrations including Zapier

  - Recurring tasks and dependencies (paid plans)


  ## Pricing


  - **Free plan**: Unlimited tasks, 10 projects, up to 10 members

  - **Starter plan**: From $5/user/month (billed annually), adds unlimited usage
  of advanced views (Gantt, calendar, table) plus recurring tasks and
  dependencies


  ## Deployment


  Cloud-based SaaS (Web, macOS, Windows, iOS, Android)


  ## Integrations


  Over 1,000 integrations including Zapier for workflow automation.
