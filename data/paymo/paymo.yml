name: Paymo
description: Paymo is a project management platform designed for managing
  projects, invoices, and billing across multiple clients. It centralizes client
  management with built-in time tracking, billable rates, flat-fee options, and
  automatic invoice generation based on tracked time. The free plan includes
  unlimited invoices and tasks for 1 user, 2 projects, and 1 client; paid plans
  start at $5.90/user/month.
