  ## Overview


  Sourcehut is a full web Git interface with no JavaScript. It provides Git
  hosting, mailing lists, issue tracking, and continuous integration.


  ## Features


  - Git hosting

  - No JavaScript required

  - Mailing lists

  - Issue tracking

  - Continuous integration

  - Simple, accessible interface


