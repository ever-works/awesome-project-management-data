markdown: >-
  ## Overview


  Octobox is a tool that helps users take control of their GitHub Notifications
  by providing a dedicated interface to organize, archive, and manage
  notification threads.


  ## Features


  - GitHub notification management

  - Thread organization

  - Archive and marking

  - Web interface

  - Keyboard navigation


  ## License


  AGPL-3.0


  ## Deployment


  Self-hosted, Ruby, Docker
